name: Publish moved page

# The app now runs on Cloudflare (https://my-future-self.flamesmp.workers.dev).
# The old GitHub Pages address only shows the "moved" page from moved/, which can carry
# a browser's saved data over to the new address.
on:
  push:
    branches: [main]
    paths: ["moved/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the moved page for every path
        run: cp moved/index.html moved/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: moved
      - id: deployment
        uses: actions/deploy-pages@v4
