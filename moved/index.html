<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <title>My Future Self has moved</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 20px; box-sizing: border-box; }
      h1 { font-size: clamp(28px, 6vw, 40px); margin: 0 0 10px; letter-spacing: -0.02em; }
      p { margin: 0 0 18px; color: rgba(255, 255, 255, 0.75); }
      a, button { display: inline-block; padding: 12px 22px; border-radius: 999px; border: 1.5px solid #fff; background: #000; color: #fff; font: inherit; font-weight: 800; cursor: pointer; text-decoration: none; }
      a:hover, button:hover { background: #fff; color: #000; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>My Future Self has moved</h1>
      <p id="has-data" hidden>Your habits saved on this browser can come with you. Press the button, then sign in with Google on the new site.</p>
      <p id="no-data">Taking you to the new address...</p>
      <button id="move" hidden>Move my data</button>
      <p><a id="go" href="https://my-future-self.flamesmp.workers.dev/">Open the new site</a></p>
    </main>
    <script src="/my-future-self/move.js"></script>
  </body>
</html>
